<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚔️ NINJA SLICE QUIZ | FRUIT NINJA STYLE 🗡️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1a472a, #0a1f12);
            font-family: 'Segoe UI', 'Poppins', 'Fredoka One', 'Comic Neue', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .game-wrapper {
            width: 1100px;
            max-width: 98vw;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 40px;
            backdrop-filter: blur(8px);
            padding: 15px;
            border: 4px solid #3a220f;
        }

        .screen-card {
            background: #fff5e6;
            border-radius: 30px;
            padding: 25px;
            box-shadow: inset 0 0 0 5px #ffbc5e, 0 20px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        h1, h2, h3 {
            text-align: center;
            color: #d43b1a;
            text-shadow: 3px 3px 0 #ffe09d;
            margin-bottom: 15px;
        }

        .ninja-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #333;
        }

        button {
            background: #ff8c42;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 12px 28px;
            margin: 8px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #aa4515;
            transition: 0.05s linear;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #aa4515;
        }

        input {
            padding: 14px 22px;
            border-radius: 60px;
            border: 3px solid #ffb347;
            font-size: 1.1rem;
            margin: 8px;
            width: 260px;
            background: #fffef7;
            outline: none;
            text-align: center;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 15px 0;
        }

        /* Ninja Slice Interactive Canvas Arena */
        .slice-arena-wrapper {
            position: relative;
            margin: 15px 0;
            border-radius: 25px;
            border: 6px solid #4a2e1b;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .slice-arena {
            background: #1e4f2c;
            width: 100%;
            height: 480px;
            position: relative;
            background-image: radial-gradient(circle at 25% 40%, rgba(255,235,120,0.15) 2%, transparent 2.5%);
            background-size: 40px 40px;
            cursor: crosshair;
        }

        /* Layered Canvas layout for trail and elements */
        .game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .question-slice {
            background: #fdebb3;
            padding: 15px 25px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 15px;
            border: 3px solid #ff914d;
            color: #3e2a0b;
            box-shadow: 0 6px 0 #c56f2a;
        }

        .timer-bar-slice {
            background: #4e2c16;
            height: 16px;
            border-radius: 40px;
            overflow: hidden;
            margin: 10px 0;
            border: 2px solid #2a160a;
        }

        .timer-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f5481f, #ff8c42);
            transition: width 0.1s linear;
        }

        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2f1c0a;
            padding: 12px 25px;
            border-radius: 50px;
            color: #ffdfa5;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        
        .leaderboard-box {
            background: #fff0cf;
            border-radius: 20px;
            padding: 15px;
            margin-top: 18px;
            max-height: 250px;
            overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #e2b87a; text-align: center; font-weight: bold; }
        th { background-color: #ffdda1; color: #733d00; }
        .restart-slice { background: #ce3e2e; box-shadow: 0 6px 0 #8a241a; }
        
        .subBtn.active-sub {
            background: #b84a00 !important;
            box-shadow: 0 6px 0 #6e2c00 !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div id="gameRoot"></div>

<script>
    // -------------------- SECURE USER SYSTEM --------------------
    let currentUser = null;
    let usersDB = JSON.parse(localStorage.getItem("ninja_secure_users") || "{}");
    let leaderboard = JSON.parse(localStorage.getItem("ninja_slice_leaderboard") || "[]");

    function hashPass(pwd) {
        let hash = 0;
        for (let i = 0; i < pwd.length; i++) {
            hash = ((hash << 5) - hash) + pwd.charCodeAt(i);
            hash |= 0;
        }
        return "h" + Math.abs(hash).toString(36);
    }

    function registerUser(username, password) {
        if (!username || username.length < 3 || username.length > 15) return "Username must be 3-15 characters";
        if (!password || password.length < 3) return "Password min 3 characters";
        if (usersDB[username]) return "Ninja name taken!";
        usersDB[username] = hashPass(password);
        localStorage.setItem("ninja_secure_users", JSON.stringify(usersDB));
        return "OK";
    }

    function loginUser(username, password) {
        if (!usersDB[username]) return "No Ninja found";
        if (usersDB[username] === hashPass(password)) {
            currentUser = username;
            return "OK";
        }
        return "Wrong Secret Code";
    }

    // -------------------- QUESTION BANK --------------------
    const Q_BANK = {};
    function buildQuestions() {
        const subjects = ["Math", "English", "Science", "GK"];
        subjects.forEach(sub => {
            Q_BANK[sub] = { easy: [], medium: [], hard: [] };
            for (let i = 1; i <= 25; i++) {
                let qEasy, qMed, qHard;
                if (sub === "Math") {
                    qEasy = { text: `🧮 ${12 + i} + ${i*2 + 3} = ?`, options: [`${12 + i + i*2 + 3}`, `${i*3+8}`, `${i+18}`, `${i*2+10}`], correct: 0 };
                    qMed = { text: `📐 Solve for x: 3x + ${i} = ${30 + i*2}`, options: [`${Math.floor((30 + i*2 - i)/3)}`, `${i+4}`, `${i+2}`, `${i+7}`], correct: 0 };
                    qHard = { text: `📏 √(${i*100 + 400}) ≈ ?`, options: [`${Math.floor(Math.sqrt(i*100+400))}`, `${i*2+3}`, `${i+9}`, `${i*1.5}`], correct: 0 };
                } else if (sub === "English") {
                    qEasy = { text: `📖 Synonym of "Brave"`, options: ["Courageous", "Scared", "Weak", "Tiny"], correct: 0 };
                    qMed = { text: `✍️ Which spelling is correct?`, options: ["Recieve", "Receive", "Receeve", "Recive"], correct: 1 };
                    qHard = { text: `🎭 "The wind whispered" is an example of?`, options: ["Simile", "Metaphor", "Personification", "Hyperbole"], correct: 2 };
                } else if (sub === "Science") {
                    qEasy = { text: `🔬 Which is known as the Red Planet?`, options: ["Mars", "Jupiter", "Venus", "Saturn"], correct: 0 };
                    qMed = { text: `⚛️ What is the chemical symbol for Gold?`, options: ["Go", "Au", "Ag", "Fe"], correct: 1 };
                    qHard = { text: `🧬 Which cells fight infection?`, options: ["RBC", "Platelets", "White Blood Cells", "Plasma"], correct: 2 };
                } else {
                    qEasy = { text: `🌍 What is the capital of Japan?`, options: ["Seoul", "Beijing", "Tokyo", "Bangkok"], correct: 2 };
                    qMed = { text: `🏆 Who painted the Sistine Chapel?`, options: ["Da Vinci", "Michelangelo", "Raphael", "Donatello"], correct: 1 };
                    qHard = { text: `📜 Who wrote the ancient epic 'The Odyssey'?`, options: ["Socrates", "Homer", "Plato", "Aristotle"], correct: 1 };
                }
                if (i <= 15) Q_BANK[sub].easy.push({ ...qEasy });
                if (i <= 20) Q_BANK[sub].medium.push({ ...qMed });
                if (i <= 25) Q_BANK[sub].hard.push({ ...qHard });
            }
        });
    }
    buildQuestions();

    // -------------------- GAME ENGINE VARIABLES --------------------
    let gameState = {
        active: false, subject: "Math", difficulty: "easy", questions: [],
        currentIdx: 0, score: 0, timeRemaining: 20, waitingNext: false
    };

    let fruits = [];
    let splatters = [];
    let bladeTrail = [];
    let isSlicing = false;
    let canvas, ctx;
    let animationFrameId = null;
    let gameLoopInterval = null;
    let globalTimerInterval = null;

    // -------------------- AUDIO SYNTH ENGINE --------------------
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSwooshSound() {
        try {
            initAudio();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch(e){}
    }

    function playSliceSound(isCorrect) {
        try {
            initAudio();
            let now = audioCtx.currentTime;
            
            // Core slicing impact noise
            let osc1 = audioCtx.createOscillator();
            let gain1 = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(isCorrect ? 800 : 250, now);
            osc1.frequency.linearRampToValueAtTime(isCorrect ? 1500 : 80, now + 0.2);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            gain1.gain.setValueAtTime(0.2, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc1.start();
            osc1.stop(now + 0.25);

            if(isCorrect) {
                // Succulent reward chime sound
                let osc2 = audioCtx.createOscillator();
                let gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(523.25, now); // C5
                osc2.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc2.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                gain2.gain.setValueAtTime(0.15, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc2.start();
                osc2.stop(now + 0.4);
            }
        } catch(e){}
    }

    // -------------------- FRUIT MATH / PHYSICS CLASS --------------------
    const FRUIT_COLORS = [
        { main: '#ff4d4d', dark: '#cc0000', text: '#ffffff' }, // Apple Red
        { main: '#ffa500', dark: '#cc8400', text: '#ffffff' }, // Orange
        { main: '#4287f5', dark: '#1c5bc2', text: '#ffffff' }, // Neon Blue berry
        { main: '#9b5de5', dark: '#6f2dbd', text: '#ffffff' }  // Plum Purple
    ];

    class LaunchableFruit {
        constructor(text, index, totalCount, canvasWidth) {
            this.text = text;
            this.index = index;
            this.isSliced = false;
            
            // Space out spawning locations uniformly across the screen base
            let segment = canvasWidth / (totalCount + 1);
            this.x = segment * (index + 1) + (Math.random() * 30 - 15);
            this.y = 500; // Launch point safely below view margin
            
            // Perfect parbolic curve speeds calculated from screen scale
            this.vx = (canvasWidth / 2 - this.x) * 0.015 + (Math.random() * 2 - 1);
            this.vy = -(14 + Math.random() * 4); // Gravity impulse push
            
            this.gravity = 0.32;
            this.radius = 55;
            this.rotation = Math.random() * Math.PI * 2;
            this.vRotation = (Math.random() * 0.04) - 0.02;
            this.color = FRUIT_COLORS[index % FRUIT_COLORS.length];
            
            // Physics parts for sliced halves
            this.halfLeftX = 0; this.halfLeftY = 0;
            this.halfRightX = 0; this.halfRightY = 0;
            this.sliceAngle = 0;
            this.splitDistance = 0;
        }

        update() {
            if (!this.isSliced) {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRotation;
            } else {
                // When sliced, drift apart realistically
                this.splitDistance += 5;
                this.vy += this.gravity * 1.2;
                this.y += this.vy;
                this.x += this.vx;
            }
        }

        draw(ctx) {
            ctx.save();
            if (!this.isSliced) {
                // Draw whole flying structural fruit sphere
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Outer skin
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                let grad = ctx.createRadialGradient(-15, -15, 5, 0, 0, this.radius);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.2, this.color.main);
                grad.addColorStop(1, this.color.dark);
                ctx.fillStyle = grad;
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 8;
                ctx.fill();
                ctx.shadowColor = 'transparent';

                // Golden inner border trim ring
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.7)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Center Text Label
                ctx.rotate(-this.rotation); // Keep text straight up
                ctx.fillStyle = this.color.text;
                ctx.font = "bold 15px 'Segoe UI', Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                this.wrapText(ctx, this.text, 0, 0, this.radius * 1.6, 18);
            } else {
                // Draw Sliced split view states
                ctx.shadowBlur = 0;
                
                // Left half section
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.sliceAngle);
                ctx.translate(-this.splitDistance, 0);
                this.drawHalfFruit(ctx, true);
                ctx.restore();

                // Right half section
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.sliceAngle);
                ctx.translate(this.splitDistance, 0);
                this.drawHalfFruit(ctx, false);
                ctx.restore();
            }
            ctx.restore();
        }

        drawHalfFruit(ctx, isLeft) {
            ctx.beginPath();
            // Arc representing exactly half a sphere circle mask
            ctx.arc(0, 0, this.radius, isLeft ? Math.PI*0.5 : Math.PI*1.5, isLeft ? Math.PI*1.5 : Math.PI*0.5);
            ctx.closePath();
            
            let grad = ctx.createRadialGradient(isLeft?-10:10, -10, 2, 0, 0, this.radius);
            grad.addColorStop(0, '#fffae6'); // Juicy fleshy inside color
            grad.addColorStop(0.85, this.color.main);
            grad.addColorStop(1, this.color.dark);
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);
            
            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            for(let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i].trim(), x, startY + (i * lineHeight));
            }
        }

        checkIntersection(p1, p2) {
            if (this.isSliced) return false;
            
            // Calculate proximity threshold distances from linear segments 
            let A = p1.x - p2.x;
            let B = p1.y - p2.y;
            let length = Math.sqrt(A*A + B*B);
            if (length < 2) return false;

            let dot = (((this.x - p1.x) * (p2.x - p1.x)) + ((this.y - p1.y) * (p2.y - p1.y))) / (length * length);
            let closestX = p1.x + (dot * (p2.x - p1.x));
            let closestY = p1.y + (dot * (p2.y - p1.y));

            // Constrain point along blade segment range bounds
            if (dot < 0) { closestX = p1.x; closestY = p1.y; }
            if (dot > 1) { closestX = p2.x; closestY = p2.y; }

            let distA = this.x - closestX;
            let distB = this.y - closestY;
            let finalDist = Math.sqrt(distA*distA + distB*distB);

            if (finalDist <= this.radius) {
                this.isSliced = true;
                this.sliceAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                this.vy = -3; // Bounce cut fragments upwards slightly
                return true;
            }
            return false;
        }
    }

    class SplatterJuice {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.radius = 20 + Math.random() * 35;
            this.alpha = 0.8;
            this.life = 45; // loop ticks to live
        }
        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            this.alpha -= 0.018;
            this.life--;
        }
    }

    // -------------------- MAIN PHYSICS ENGINE RUNTIME LOOP --------------------
    function initCanvasArena() {
        canvas = document.getElementById("arenaCanvas");
        if (!canvas) return;
        ctx = canvas.getContext("2d");
        
        // Resize canvas correctly based on DOM wrappers
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = 480;

        // Blade stroke slice inputs bindings
        const arena = document.getElementById("sliceArena");
        arena.addEventListener("mousedown", handleStartSlice);
        arena.addEventListener("mousemove", handleMoveSlice);
        window.addEventListener("mouseup", handleEndSlice);

        arena.addEventListener("touchstart", (e) => { handleStartSlice(e.touches[0]); e.preventDefault(); }, {passive: false});
        arena.addEventListener("touchmove", (e) => { handleMoveSlice(e.touches[0]); e.preventDefault(); }, {passive: false});
        arena.addEventListener("touchend", () => { handleEndSlice(); }, {passive: false});

        if(animationFrameId) cancelAnimationFrame(animationFrameId);
        runPhysicsTick();
    }

    function handleStartSlice(e) {
        isSlicing = true;
        let pos = getCanvasPos(e);
        bladeTrail = [{ x: pos.x, y: pos.y, age: 0 }];
        playSwooshSound();
    }

    function handleMoveSlice(e) {
        if (!isSlicing) return;
        let pos = getCanvasPos(e);
        let p1 = bladeTrail[bladeTrail.length - 1];
        let p2 = { x: pos.x, y: pos.y, age: 0 };
        
        bladeTrail.push(p2);
        if (bladeTrail.length > 15) bladeTrail.shift();

        // Evaluate blade intersection logic against all launched fruits
        if (p1 && gameState.active && !gameState.waitingNext) {
            fruits.forEach((fruit) => {
                if (fruit.checkIntersection(p1, p2)) {
                    processFruitSlice(fruit);
                }
            });
        }
    }

    function handleEndSlice() {
        isSlicing = false;
    }

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    function runPhysicsTick() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render static persistent splatter visual layers
        splatters = splatters.filter(s => s.life > 0);
        splatters.forEach(s => s.draw(ctx));

        // Manage Fruit physics arrays lifecycle updates
        fruits.forEach((fruit) => {
            fruit.update();
            fruit.draw(ctx);
        });

        // Decay slice blade glowing trails textures
        ctx.save();
        if (bladeTrail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
            for (let i = 1; i < bladeTrail.length; i++) {
                ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
            }
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.stroke();
        }
        ctx.restore();

        // Trim dynamic tail array sizes
        if(!isSlicing && bladeTrail.length > 0) {
            bladeTrail.shift();
        }

        animationFrameId = requestAnimationFrame(runPhysicsTick);
    }

    // -------------------- LOGICAL ANSWER VERIFICATION RULE --------------------
    function processFruitSlice(fruit) {
        const q = gameState.questions[gameState.currentIdx];
        const isCorrect = (fruit.index === q.correct);

        playSliceSound(isCorrect);
        
        // Spawn juice splash bursting across cut vector origin
        splatters.push(new SplatterJuice(fruit.x, fruit.y, fruit.color.main));

        if (isCorrect) {
            gameState.score++;
            document.getElementById("scoreSliceValue").innerText = gameState.score;
            gameState.waitingNext = true;
            
            setTimeout(() => {
                gameState.currentIdx++;
                if (gameState.currentIdx >= gameState.questions.length) {
                    endGameVictory();
                } else {
                    gameState.waitingNext = false;
                    launchRoundFruitBatch();
                }
            }, 800); // Give ample visual frame time to view satisfying split animation
        } else {
            gameState.active = false;
            setTimeout(() => {
                saveScore();
                alert(`💥 WRONG SLICE! Sliced an incorrect answer.\n\nScore achieved: ${gameState.score}`);
                renderScreen("menu");
            }, 500);
        }
    }

    function launchRoundFruitBatch() {
        if (!gameState.active) return;
        
        // Reset local interface components
        gameState.timeRemaining = 20;
        document.getElementById("qCounterSlice").innerText = `${gameState.currentIdx + 1}/${gameState.questions.length}`;
        
        const q = gameState.questions[gameState.currentIdx];
        document.getElementById("sliceQuestion").innerText = q.text;

        fruits = [];
        // Map answers directly into dynamic launchable instances 
        q.options.forEach((opt, idx) => {
            fruits.push(new LaunchableFruit(opt, idx, q.options.length, canvas.width));
        });
    }

    // -------------------- APP MANAGEMENT TIMERS & SAVES --------------------
    function startTimerTick() {
        if(globalTimerInterval) clearInterval(globalTimerInterval);
        
        globalTimerInterval = setInterval(() => {
            if (!gameState.active || gameState.waitingNext) return;
            
            gameState.timeRemaining--;
            const fill = document.getElementById("timerSliceFill");
            if(fill) fill.style.width = `${(gameState.timeRemaining / 20) * 100}%`;

            if (gameState.timeRemaining <= 0) {
                gameState.active = false;
                clearInterval(globalTimerInterval);
                saveScore();
                alert(`⏰ TIME'S UP! Speed up your slicing reflexes next time.`);
                renderScreen("menu");
            }
        }, 1000);
    }

    function endGameVictory() {
        gameState.active = false;
        if(globalTimerInterval) clearInterval(globalTimerInterval);
        saveScore();
        alert(`🏆 MAGNIFICENT SENSEI! Perfect Ninja Slicing Score: ${gameState.score}/${gameState.questions.length}`);
        renderScreen("menu");
    }

    function saveScore() {
        if (!currentUser || gameState.score === 0) return;
        leaderboard.push({ 
            user: currentUser, 
            score: gameState.score, 
            subject: gameState.subject, 
            diff: gameState.difficulty, 
            date: new Date().toLocaleDateString() 
        });
        leaderboard.sort((a, b) => b.score - a.score);
        leaderboard = leaderboard.slice(0, 10);
        localStorage.setItem("ninja_slice_leaderboard", JSON.stringify(leaderboard));
    }

    function beginGame(subject, difficulty) {
        if (!currentUser) { alert("Identify yourself, Ninja! Log in first."); renderScreen("login"); return; }
        
        const qSet = Q_BANK[subject][difficulty];
        gameState = { 
            active: true, 
            subject, 
            difficulty, 
            questions: [...qSet], 
            currentIdx: 0, 
            score: 0, 
            timeRemaining: 20, 
            waitingNext: false 
        };

        renderScreen("quiz");
        initCanvasArena();
        launchRoundFruitBatch();
        startTimerTick();
    }

    // -------------------- VIEW LAYOUT RENDERING INTERFACE --------------------
    const root = document.getElementById("gameRoot");
    function renderScreen(screen) {
        // Clean lingering memory bounds loops
        if(animationFrameId) cancelAnimationFrame(animationFrameId);
        if(globalTimerInterval && screen !== "quiz") clearInterval(globalTimerInterval);

        if (screen === "login") {
            root.innerHTML = `
            <div class="game-wrapper">
                <div class="screen-card">
                    <div class="ninja-badge">🍉🗡️ NINJA QUIZ 🗡️🍊</div>
                    <h3 style="text-align:center; color:#666; margin-bottom:15px;">A Swipe-to-Slice Academic Arena</h3>
                    <div class="flex-row">
                        <input type="text" id="loginUser" placeholder="Ninja Name" maxlength="15">
                        <input type="password" id="loginPass" placeholder="Secret Code">
                    </div>
                    <div class="flex-row">
                        <button id="doLogin">⚡ Enter Arena</button>
                        <button id="doRegister" style="background:#4caf50; box-shadow:0 6px 0 #2e6931;">🍥 Enlist New Ninja</button>
                    </div>
                    <div class="flex-row">
                        <button id="termsHowtoBtn" style="background:#795548; box-shadow:0 6px 0 #4e342e;">📜 How to Play Instructions</button>
                    </div>
                </div>
            </div>`;
            
            document.getElementById("doLogin")?.addEventListener("click", () => {
                const name = document.getElementById("loginUser").value.trim();
                const pass = document.getElementById("loginPass").value;
                const res = loginUser(name, pass);
                if (res === "OK") renderScreen("menu"); else alert(res);
            });
            document.getElementById("doRegister")?.addEventListener("click", () => {
                const name = document.getElementById("loginUser").value.trim();
                const pass = document.getElementById("loginPass").value;
                const res = registerUser(name, pass);
                if (res === "OK") alert("Ninja Enlisted Successfully! Proceed to login."); else alert(res);
            });
            document.getElementById("termsHowtoBtn")?.addEventListener("click", () => renderScreen("howto"));
        } 
        else if (screen === "menu") {
            root.innerHTML = `
            <div class="game-wrapper">
                <div class="screen-card">
                    <h2>⚔️ Welcome Honorable ${currentUser} ⚔️</h2>
                    <div class="flex-row">
                        <button id="showLeader" style="background:#ffc107; color:#333; box-shadow:0 6px 0 #b38600;">🏆 Top Ninja Ranks</button>
                        <button id="howToMenu" style="background:#00bcd4; box-shadow:0 6px 0 #00838f;">📖 Slicing Guide</button>
                    </div>
                    
                    <h3 style="margin-top:20px;">1. Choose Wisdom Subject</h3>
                    <div class="flex-row">
                        <button class="subBtn ${gameState.subject==='Math'?'active-sub':''}" data-sub="Math">🧮 Math</button>
                        <button class="subBtn ${gameState.subject==='English'?'active-sub':''}" data-sub="English">📖 English</button>
                        <button class="subBtn ${gameState.subject==='Science'?'active-sub':''}" data-sub="Science">🔬 Science</button>
                        <button class="subBtn ${gameState.subject==='GK'?'active-sub':''}" data-sub="GK">🌍 GK</button>
                    </div>
                    
                    <h3>2. Choose Challenge Difficulty</h3>
                    <div class="flex-row">
                        <button class="diffBtn" data-diff="easy" style="background:#8bc34a; box-shadow:0 6px 0 #558b2f;">🌿 Apprentice (15 Qs)</button>
                        <button class="diffBtn" data-diff="medium" style="background:#ff9800; box-shadow:0 6px 0 #ef6c00;">🔥 Warrior (20 Qs)</button>
                        <button class="diffBtn" data-diff="hard" style="background:#e91e63; box-shadow:0 6px 0 #ad1457;">💀 Shadow Master (25 Qs)</button>
                    </div>
                </div>
            </div>`;

            document.querySelectorAll(".subBtn").forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll(".subBtn").forEach(b => b.classList.remove("active-sub"));
                    btn.classList.add("active-sub");
                    gameState.subject = btn.dataset.sub;
                };
            });

            document.querySelectorAll(".diffBtn").forEach(btn => {
                btn.onclick = () => beginGame(gameState.subject, btn.dataset.diff);
            });

            document.getElementById("showLeader").onclick = () => renderScreen("leaderboard");
            document.getElementById("howToMenu").onclick = () => renderScreen("howto");
        }
        else if (screen === "quiz") {
            root.innerHTML = `
            <div class="game-wrapper">
                <div class="screen-card" style="padding:15px;">
                    <div class="score-panel">
                        <span>🗡️ Ninja: ${currentUser}</span>
                        <span>🍉 SCORE: <span id="scoreSliceValue">0</span></span>
                        <span>📜 Question: <span id="qCounterSlice">0/0</span></span>
                    </div>
                    <div class="timer-bar-slice"><div class="timer-fill" id="timerSliceFill"></div></div>
                    <div id="sliceQuestion" class="question-slice">Preparing Scroll...</div>
                    
                    <div class="slice-arena-wrapper">
                        <div id="sliceArena" class="slice-arena">
                            <canvas id="arenaCanvas" class="game-canvas"></canvas>
                        </div>
                    </div>
                    
                    <div style="text-align:center;">
                        <button id="quitQuiz" class="restart-slice">🏮 Retreat to Menu</button>
                    </div>
                </div>
            </div>`;

            document.getElementById("quitQuiz").onclick = () => {
                gameState.active = false;
                renderScreen("menu");
            };
        }
        else if (screen === "leaderboard") {
            let rows = leaderboard.map(l => `<tr><td>${l.user}</td><td>${l.score}</td><td>${l.subject}</td><td>${l.diff.toUpperCase()}</td><td>${l.date}</td></tr>`).join("");
            root.innerHTML = `
            <div class="game-wrapper">
                <div class="screen-card">
                    <h2>🏆 HIGH SCORE SCROLLS</h2>
                    <div class="leaderboard-box">
                        <table>
                            <thead>
                                <tr><th>Ninja Name</th><th>Score</th><th>Subject</th><th>Rank</th><th>Date</th></tr>
                            </thead>
                            <tbody>
                                ${rows || "<tr><td colspan=5>No records found in this region yet.</td></tr>"}
                            </tbody>
                        </table>
                    </div>
                    <div class="flex-row"><button id="backMenu" style="margin-top:15px;">Return to Hub</button></div>
                </div>
            </div>`;
            document.getElementById("backMenu").onclick = () => renderScreen("menu");
        }
        else if (screen === "howto") {
            root.innerHTML = `
            <div class="game-wrapper">
                <div class="screen-card">
                    <h2>⚔️ MANDATORY SLICING TECHNIQUE ⚔️</h2>
                    <p style="font-size:1.15rem; line-height:1.75; color:#4a2e1b; padding:10px;">
                        🍉 <strong>LAUNCHING ANSWERS:</strong> Options will erupt upward into the air simultaneously!<br>
                        🗡️ <strong>SWIPE TO CUT:</strong> Click and drag your mouse (or drag your finger across mobile screens) to generate a sword blade line. <br>
                        ✅ <strong>CRITICAL HIT:</strong> Slice across the fruit bearing the correct solution to progress.<br>
                        💥 <strong>EXPLOSIVE FAIL:</strong> Slicing any incorrect fruit or running out of the <strong>20-second</strong> timer results in an immediate game over.
                    </p>
                    <div class="flex-row"><button id="backHome">Acknowledge</button></div>
                </div>
            </div>`;
            document.getElementById("backHome").onclick = () => currentUser ? renderScreen("menu") : renderScreen("login");
        }
    }

    // Initialize application view state on launch
    renderScreen("login");
    document.body.addEventListener("pointerdown", initAudio, { once: true });
</script>
</body>
</html>
